# Production: full autoscaling range. The DB password is a SealedSecret (see docs/secrets.md).
global:
  environment: prod
ingress:
  host: seatsurge.localhost
config:
  # Reset is enabled only so the classroom demo can be replayed; a real launch would set false.
  allowReset: true
secrets:
  sealed: true
  # Encrypted with: kubeseal --raw --namespace seatsurge-prod --name seatsurge-postgres
  # Only the Sealed Secrets controller in the cluster can decrypt this value.
  encryptedPostgresPassword: 
