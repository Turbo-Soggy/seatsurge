{{- $name := include "seatsurge.secretName" . -}}
{{- if .Values.secrets.sealed }}
# Encrypted with the cluster's Sealed Secrets public key (kubeseal). Only the
# controller inside the cluster can decrypt it, so it is safe to commit to git.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "seatsurge.labels" . | nindent 4 }}
spec:
  encryptedData:
    password: {{ required "secrets.encryptedPostgresPassword is required when secrets.sealed=true" .Values.secrets.encryptedPostgresPassword }}
  template:
    metadata:
      name: {{ $name }}
      labels:
        {{- include "seatsurge.labels" . | nindent 8 }}
{{- else }}
{{- /* Generate once, then reuse the existing value on every upgrade. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "seatsurge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
