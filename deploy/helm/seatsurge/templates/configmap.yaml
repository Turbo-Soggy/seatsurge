apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seatsurge.fullname" . }}-config
  labels:
    {{- include "seatsurge.labels" . | nindent 4 }}
data:
  HOLD_TTL_SECONDS: {{ .Values.config.holdTtlSeconds | quote }}
  MAX_SEATS_PER_HOLD: {{ .Values.config.maxSeatsPerHold | quote }}
  PAYMENT_FAILURE_RATE: {{ .Values.config.paymentFailureRate | quote }}
  ALLOW_RESET: {{ .Values.config.allowReset | quote }}
