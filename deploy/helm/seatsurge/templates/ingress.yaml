{{- if .Values.ingress.enabled }}
{{- $fullname := include "seatsurge.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "seatsurge.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/inventory
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-inventory
                port: { name: http }
          - path: /api/checkout
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-checkout
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port: { name: http }
{{- end }}
