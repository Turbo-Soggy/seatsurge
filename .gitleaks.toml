title = "SeatSurge gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives"
regexTarget = "line"
regexes = [
  # SealedSecret ciphertext is encrypted with the cluster's public key; only the cluster can decrypt it.
  '''encryptedPostgresPassword: Ag[A-Za-z0-9+/=]+''',
  # Name of the key inside a Kubernetes Secret, not a password value.
  '''passwordKey\s*=\s*"admin-password"''',
]
