name: Release

# Pushing a tag like v1.1.0 publishes a GitHub Release with the packaged Helm
# chart attached. CI (same tag) builds and pushes the semver-tagged images.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Package chart with the release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/seatsurge --version "$VERSION" --app-version "$VERSION" -d dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --title "SeatSurge $GITHUB_REF_NAME" --generate-notes --verify-tag
